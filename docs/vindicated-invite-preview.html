<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VINdicated Invite Email</title>
<style>
/* Plain inbox mock: one email at a time, invite card on top, tabs for each email type */
:root { --bg:#f4f2f5; --card:#ffffff; --fg:#1d1a1f; --soft:#4a4550; --rule:#dcd8df; --accent:#9533A5; --tint:#f6eff8; --no:#a32a2a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 Arial, Helvetica, sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 24px 60px; padding-inline: 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.tabs button { font: inherit; font-size: 15px; padding: 6px 14px; border: 1px solid var(--rule); background: var(--card); color: var(--fg); cursor: pointer; border-radius: 0; }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.mail { background: var(--card); border: 1px solid var(--rule); }
.head { padding: 18px 20px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.subject { font-size: 22px; font-weight: 700; margin: 0; }
.from { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--soft); font-size: 15px; }
.from b { color: var(--fg); }
.invite { margin: 18px 20px; border: 1px solid var(--rule); display: grid; grid-template-columns: 92px 1fr; }
.datebox { border-right: 1px solid var(--rule); text-align: center; padding: 14px 6px; }
.datebox .m { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.datebox .d { font-size: 38px; line-height: 1.1; font-weight: 700; }
.datebox .w { font-size: 14px; color: var(--soft); }
.details { padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.details h2 { font-size: 19px; margin: 0 0 4px; }
.details p { margin: 0; overflow-wrap: anywhere; }
.rsvp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.rsvp span { font-size: 15px; color: var(--soft); margin-right: 4px; }
.rsvp button { font: inherit; font-size: 15px; padding: 5px 16px; border: 1px solid var(--soft); background: var(--card); color: var(--fg); border-radius: 0; cursor: pointer; }
.rsvp button[aria-pressed="true"] { background: var(--fg); color: #fff; border-color: var(--fg); }
.cancelled { grid-column: 1 / -1; background: #fbeeee; color: var(--no); font-weight: 700; padding: 8px 16px; border-bottom: 1px solid var(--rule); }
.strike { text-decoration: line-through; color: var(--soft); }
.changed { background: var(--tint); padding: 0 4px; }
.body { padding: 4px 20px 20px; }
.body p { margin: 0 0 12px; }
.attach { margin: 0 20px 20px; display: inline-flex; gap: 10px; align-items: center; border: 1px solid var(--rule); padding: 8px 12px; font-size: 15px; }
.attach b { font-family: "Courier New", monospace; }
.note { margin-top: 18px; font-size: 15px; color: var(--soft); }
pre { background: var(--card); border: 1px solid var(--rule); padding: 16px; overflow-x: auto; font: 14px/1.5 "Courier New", monospace; margin: 0; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 480px) { .invite { grid-template-columns: 70px 1fr; } .datebox .d { font-size: 30px; } .subject { font-size: 19px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="group" aria-label="Which email">
    <button data-v="invite" aria-pressed="true">New invite</button>
    <button data-v="update" aria-pressed="false">Time changed</button>
    <button data-v="cancel" aria-pressed="false">Cancelled</button>
    <button data-v="ics" aria-pressed="false">The invite file</button>
  </div>
  <div id="view"></div>
  <p class="note" id="note"></p>
</div>
<script>
const views = {
  invite: {
    subject: "Invitation: UCLA board meeting · Sundays 6–6:30pm",
    when: "Sunday, Oct 18 · 6:00–6:30pm (PDT)", repeat: "Weekly on Sunday, until Nov 22",
    body: `<p>Hi Will,</p><p>You're invited to the weekly UCLA board meeting. Tap Yes, Maybe or No above to add it to your calendar.</p><p>Bring your update on this week's deliverables. Your tasks are on the board hub: <a href="#">getvindicated.org/board/ucla</a></p><p>Fiona</p>`,
    note: "This is what every invited member gets. In Gmail, Apple Mail and Outlook the Yes / Maybe / No buttons are real: tapping one adds the meeting to their calendar and sends their reply to the organizer."
  },
  update: {
    subject: "Updated invitation: UCLA board meeting · Sundays 6:30–7pm",
    when: `<span class="strike">6:00–6:30pm</span> <span class="changed">6:30–7:00pm</span> · Sunday, Oct 18 (PDT)`, repeat: "Weekly on Sunday, until Nov 22",
    body: `<p>Hi Will,</p><p>The weekly board meeting moved to <b>6:30–7pm</b>, starting this Sunday. Your calendar updates on its own, so there's nothing to delete.</p><p>Fiona</p>`,
    note: "When Fiona edits a meeting on the hub, this goes out. It replaces the event already on everyone's calendar instead of adding a second one."
  },
  cancel: {
    subject: "Cancelled: UCLA board meeting · Sunday, Nov 22",
    when: "Sunday, Nov 22 · 6:00–6:30pm (PDT)", repeat: "", cancelled: true,
    body: `<p>Hi Will,</p><p>No board meeting on Sunday, Nov 22 (Thanksgiving week). The rest of the series is unchanged.</p><p>Fiona</p>`,
    note: "Deleting a meeting, or one date of a weekly series, sends this. Calendar apps remove it automatically."
  }
};
const ics = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//VINdicated//Board Hub//EN
METHOD:REQUEST
BEGIN:VEVENT
UID:ucla-board-weekly@getvindicated.org
SEQUENCE:0
DTSTAMP:20261012T190000Z
DTSTART;TZID=America/Los_Angeles:20261018T180000
DTEND;TZID=America/Los_Angeles:20261018T183000
RRULE:FREQ=WEEKLY;BYDAY=SU;UNTIL=20261123T075959Z
SUMMARY:UCLA board meeting
LOCATION:[location or Zoom link]
DESCRIPTION:Weekly UCLA board meeting. Tasks: getvindicated.org/board/ucla
ORGANIZER;CN=Fiona (VINdicated at UCLA):mailto:fionarhine@ucla.edu
ATTENDEE;CN=Will Prawira;ROLE=REQ-PARTICIPANT;PARTSTAT=NEEDS-ACTION;RSVP=TRUE:mailto:will@example.com
END:VEVENT
END:VCALENDAR`;
function mail(v) {
  return `<div class="mail">
    <div class="head">
      <p class="subject">${v.subject}</p>
      <div class="from"><span><b>VINdicated at UCLA</b> &lt;board@getvindicated.org&gt;</span><span>to Will</span></div>
    </div>
    <div class="invite">
      ${v.cancelled ? `<div class="cancelled">This event has been cancelled</div>` : ""}
      <div class="datebox"><div class="m">${v.cancelled ? "Nov" : "Oct"}</div><div class="d">${v.cancelled ? "22" : "18"}</div><div class="w">Sun</div></div>
      <div class="details">
        <h2 class="${v.cancelled ? "strike" : ""}">UCLA board meeting</h2>
        <p><b>When:</b> ${v.when}</p>
        ${v.repeat ? `<p><b>Repeats:</b> ${v.repeat}</p>` : ""}
        <p><b>Where:</b> [location or Zoom link]</p>
        <p><b>Organizer:</b> Fiona</p>
        ${v.cancelled ? "" : `<div class="rsvp"><span>Going?</span><button data-r>Yes</button><button data-r>Maybe</button><button data-r>No</button></div>`}
      </div>
    </div>
    <div class="body">${v.body}</div>
    <div class="attach">📅 <b>invite.ics</b> calendar invite</div>
  </div>`;
}
function show(k) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === k));
  if (k === "ics") {
    document.getElementById("view").innerHTML = `<pre>${ics.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>`;
    document.getElementById("note").textContent = "The attachment the site builds behind the scenes. The UID keeps it the same event when it's edited, and SEQUENCE goes up by one with each change. Nobody has to look at this.";
  } else {
    document.getElementById("view").innerHTML = mail(views[k]);
    document.getElementById("note").textContent = views[k].note;
  }
}
document.addEventListener("click", e => {
  const t = e.target.closest(".tabs button"); if (t) return show(t.dataset.v);
  const r = e.target.closest("[data-r]");
  if (r) r.parentElement.querySelectorAll("[data-r]").forEach(b => b.setAttribute("aria-pressed", b === r));
});
show("invite");
</script>
</body>
</html>
