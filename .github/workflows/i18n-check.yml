name: "i18n: check translations"

# Every language file must have exactly the same keys and placeholders as
# en.json, and no untranslated English. See scripts/check-i18n.mjs.
on:
  pull_request:
    paths:
      - "lib/i18n/**"
      - "scripts/check-i18n.mjs"
      - ".github/workflows/i18n-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-i18n.mjs
